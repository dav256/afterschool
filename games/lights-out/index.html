<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lights Out</title>
<style>
body { font-family: system-ui, sans-serif; background:#111; color:#eee; display:flex; flex-direction:column; align-items:center; min-height:100vh; margin:0; padding:20px; }
h1 { margin:10px 0; }
#board { display:grid; grid-template-columns:repeat(5,60px); gap:5px; margin:20px 0; }
.cell { width:60px; height:60px; background:#222; border:2px solid #444; border-radius:8px; cursor:pointer; transition:background .1s; }
.cell.on { background:#facc15; box-shadow:0 0 15px #facc15; }
#moves { font-size:1.2rem; }
button { margin-top:10px; padding:10px 20px; background:#333; color:#fff; border:none; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<h1>Lights Out</h1>
<div id="moves">Moves: 0</div>
<div id="board"></div>
<button id="reset">New Puzzle</button>
<script>
const SIZE = 5;
let board, moves;
const boardEl = document.getElementById("board");
const movesEl = document.getElementById("moves");
function init() {
  board = Array(SIZE).fill().map(() => Array(SIZE).fill(false));
  moves = 0;
  // Randomize with solvable pattern
  for (let i=0; i<15; i++) toggle(Math.floor(Math.random()*SIZE), Math.floor(Math.random()*SIZE), false);
  render();
}
function toggle(r, c, count=true) {
  const dirs = [[0,0],[0,1],[0,-1],[1,0],[-1,0]];
  for (let [dr,dc] of dirs) {
    const nr=r+dr, nc=c+dc;
    if (nr>=0 && nr<SIZE && nc>=0 && nc<SIZE) board[nr][nc] = !board[nr][nc];
  }
  if (count) moves++;
}
function render() {
  boardEl.innerHTML = "";
  for (let r=0; r<SIZE; r++) for (let c=0; c<SIZE; c++) {
    const cell = document.createElement("div");
    cell.className = "cell" + (board[r][c] ? " on" : "");
    cell.onclick = () => { toggle(r,c); render(); if (isWin()) alert("You win in " + moves + " moves!"); };
    boardEl.appendChild(cell);
  }
  movesEl.textContent = "Moves: " + moves;
}
function isWin() { return board.every(row => row.every(v => !v)); }
document.getElementById("reset").onclick = init;
init();
</script>
</body>
</html>
