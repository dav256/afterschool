<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Afterschool</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d100e;color:#e8f0e9;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  .topbar{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .back{color:#7dffa3;text-decoration:none;font-size:.95rem}
  .back:hover{text-decoration:underline}
  h1{font-size:1.25rem;font-weight:600}
  button{background:#151a16;color:#7dffa3;border:1px solid #7dffa3;border-radius:8px;padding:7px 14px;font-size:.9rem;cursor:pointer}
  button:hover{background:#7dffa3;color:#0d100e}
  .panel{background:#151a16;border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .status{display:flex;gap:24px;font-size:1rem}
  .status b{color:#7dffa3}
  canvas{background:#0d100e;border:1px solid #2a332b;border-radius:10px;max-width:100%;height:auto;touch-action:none}
  .hint{color:#93a396;font-size:.85rem;text-align:center}
  .overlay{position:relative}
  .gameover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(13,16,14,.82);border-radius:10px;text-align:center;padding:16px}
  .gameover.show{display:flex}
  .gameover h2{font-size:1.6rem;color:#7dffa3}
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../../index.html">&larr; Afterschool</a>
    <h1>Snake</h1>
    <button id="restartBtn" type="button">Restart</button>
  </div>
  <div class="panel">
    <div class="status"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
    <div class="overlay">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="gameover" id="gameover">
        <h2>Game Over</h2>
        <p id="finalScore"></p>
        <button id="againBtn" type="button">Play Again</button>
      </div>
    </div>
    <p class="hint">Arrow keys or WASD to steer &middot; swipe on touch</p>
  </div>
<script>
(function(){
  var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  var CELL=20,COLS=24,ROWS=24;
  var scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
  var overEl=document.getElementById('gameover'),finalEl=document.getElementById('finalScore');
  var best=parseInt(localStorage.getItem('snakeBest')||'0',10)||0;
  bestEl.textContent=best;
  var snake,dir,nextDir,food,score,delay,timer,alive;

  function placeFood(){
    while(true){
      var f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
      var ok=true;
      for(var i=0;i<snake.length;i++){if(snake[i].x===f.x&&snake[i].y===f.y){ok=false;break;}}
      if(ok){food=f;return;}
    }
  }
  function reset(){
    snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];
    dir={x:1,y:0};nextDir=dir;score=0;delay=140;alive=true;
    scoreEl.textContent='0';
    overEl.classList.remove('show');
    placeFood();draw();
    clearInterval(timer);timer=setInterval(step,delay);
  }
  function setSpeed(){
    clearInterval(timer);timer=setInterval(step,delay);
  }
  function step(){
    dir=nextDir;
    var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS){return gameOver();}
    for(var i=0;i<snake.length;i++){if(snake[i].x===head.x&&snake[i].y===head.y){return gameOver();}}
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
      score+=10;scoreEl.textContent=score;
      if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('snakeBest',String(best));}
      placeFood();
      if(delay>70){delay-=4;setSpeed();}
    }else{snake.pop();}
    draw();
  }
  function gameOver(){
    alive=false;clearInterval(timer);
    finalEl.textContent='You scored '+score+' points.';
    overEl.classList.add('show');
  }
  function draw(){
    ctx.fillStyle='#0d100e';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#ff5d73';
    ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2-2,0,Math.PI*2);ctx.fill();
    for(var i=0;i<snake.length;i++){
      ctx.fillStyle=i===0?'#7dffa3':'#3fbf6f';
      ctx.fillRect(snake[i].x*CELL+1,snake[i].y*CELL+1,CELL-2,CELL-2);
    }
  }
  function setDir(x,y){
    if(dir.x===-x&&dir.y===-y)return;
    if(dir.x===x&&dir.y===y)return;
    nextDir={x:x,y:y};
  }
  document.addEventListener('keydown',function(e){
    var k=e.key.toLowerCase();
    if(k==='arrowup'||k==='w'){setDir(0,-1);e.preventDefault();}
    else if(k==='arrowdown'||k==='s'){setDir(0,1);e.preventDefault();}
    else if(k==='arrowleft'||k==='a'){setDir(-1,0);e.preventDefault();}
    else if(k==='arrowright'||k==='d'){setDir(1,0);e.preventDefault();}
    else if(k===' '){e.preventDefault();if(!alive)reset();}
  });
  var tx=0,ty=0;
  canvas.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  canvas.addEventListener('touchmove',function(e){
    e.preventDefault();
    var dx=e.touches[0].clientX-tx,dy=e.touches[0].clientY-ty;
    if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
    if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
    tx=e.touches[0].clientX;ty=e.touches[0].clientY;
  },{passive:false});
  document.getElementById('restartBtn').addEventListener('click',reset);
  document.getElementById('againBtn').addEventListener('click',reset);
  reset();
})();
</script>
</body>
</html>
