<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Merge Numbers</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a12;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px}
h1{color:#9fe8d0;margin:8px}#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(320px,90vw)}.cell{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;background:#1a1a22;border:2px solid #2a2a32;cursor:pointer}.cell.sel{border-color:#9fe8d0}.hud{margin:10px;font-weight:700}.btn{margin-top:12px;padding:10px 20px;border:none;border-radius:999px;background:#9fe8d0;color:#0a0a0a;font-weight:700}
</style></head><body>
<h1>Merge Numbers</h1>
<p style="color:#8b8b96;text-align:center">Tap two equal numbers to merge</p>
<div class="hud" id="score">Score: 0</div>
<div id="grid"></div>
<button class="btn" id="restart">Restart</button>
<script>
const grid=document.getElementById('grid');let cells=[],sel=null,score=0;
function color(n){const h=(Math.log2(n)*40)%360;return `hsl(${h} 65% 45%)`;}
function render(){
  grid.innerHTML='';
  cells.forEach((n,i)=>{
    const d=document.createElement('div');d.className='cell'+(sel===i?' sel':'');
    if(n){d.textContent=n;d.style.background=color(n);}
    d.onclick=()=>tap(i);grid.appendChild(d);
  });
}
function spawn(){const empty=cells.map((n,i)=>n?null:i).filter(x=>x!==null);if(!empty.length)return;cells[empty[Math.floor(Math.random()*empty.length)]]=[2,2,2,4][Math.floor(Math.random()*4)];}
function tap(i){
  if(!cells[i])return;
  if(sel===null){sel=i;render();return;}
  if(sel===i){sel=null;render();return;}
  if(cells[sel]===cells[i]){const v=cells[sel]*2;cells[i]=v;cells[sel]=0;score+=v;document.getElementById('score').textContent='Score: '+score;spawn();}
  sel=null;render();
}
function reset(){cells=Array(16).fill(0);score=0;sel=null;document.getElementById('score').textContent='Score: 0';spawn();spawn();render();}
document.getElementById('restart').onclick=reset;reset();
</script></body></html>
