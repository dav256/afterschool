<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon — Afterschool</title>
<style>
  :root{--bg:#0d100e;--panel:#151a16;--accent:#7dffa3;--ink:#e8f0e9;--muted:#93a396;--line:#243028}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;min-height:100vh;padding:1.2rem 1rem 2.5rem}
  .wrap{max-width:480px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.8rem 1.1rem}
  .topbar a.back{color:var(--muted);text-decoration:none;font-size:.92rem;white-space:nowrap}
  .topbar a.back:hover{color:var(--accent)}
  .topbar h1{font-size:1.15rem;font-weight:600;text-align:center}
  button{background:var(--accent);color:#0d100e;border:none;border-radius:999px;padding:.55rem 1.15rem;font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.45;cursor:default;filter:none}
  .status{display:flex;justify-content:space-between;gap:1rem;margin:1.1rem .2rem .4rem;font-size:.98rem}
  .status b{color:var(--accent);font-weight:600}
  .msg{text-align:center;font-size:1.05rem;min-height:1.5em;margin:.2rem 0 .4rem}
  .msg b{color:var(--accent)}
  .hint{color:var(--muted);font-size:.85rem;margin:0 .2rem 1.1rem;text-align:center}
  .board{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;max-width:340px;margin:0 auto}
  .pad{aspect-ratio:1;border:none;border-radius:22px;cursor:pointer;opacity:.55;transition:opacity .12s ease,transform .12s ease;-webkit-tap-highlight-color:transparent}
  .pad.lit{opacity:1;transform:scale(1.04)}
  .pad.green {background:#2fae5f;border-top-left-radius:110px}
  .pad.red   {background:#d23b3b;border-top-right-radius:110px}
  .pad.yellow{background:#e3b93c;border-bottom-left-radius:110px}
  .pad.blue  {background:#3b6fd2;border-bottom-right-radius:110px}
  .pad:disabled{cursor:default}
  .controls{text-align:center;margin-top:1.4rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="../../index.html">&larr; Afterschool</a>
    <h1>Simon</h1>
    <button id="restartBtn" type="button">Restart</button>
  </div>
  <div class="status">
    <span>Score: <b id="score">0</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>
  <p class="msg" id="msg">Press Start, watch the pattern, then repeat it.</p>
  <p class="hint">The sequence grows by one every round. One wrong pad ends the game.</p>
  <div class="board" id="board">
    <button type="button" class="pad green"  data-i="0" aria-label="Green pad"></button>
    <button type="button" class="pad red"    data-i="1" aria-label="Red pad"></button>
    <button type="button" class="pad yellow" data-i="2" aria-label="Yellow pad"></button>
    <button type="button" class="pad blue"   data-i="3" aria-label="Blue pad"></button>
  </div>
  <div class="controls">
    <button id="startBtn" type="button">Start</button>
  </div>
</div>
<script>
(function(){
  "use strict";
  var FREQS = [329.63, 261.63, 392.00, 440.00]; // green, red, yellow, blue
  var pads = Array.prototype.slice.call(document.querySelectorAll(".pad"));
  var scoreEl = document.getElementById("score");
  var bestEl  = document.getElementById("best");
  var msgEl   = document.getElementById("msg");
  var startBtn = document.getElementById("startBtn");
  var restartBtn = document.getElementById("restartBtn");
  var seq = [], input = 0, accepting = false, playing = false, best = 0, runId = 0;
  var audioCtx = null;

  function beep(i, dur){
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = FREQS[i];
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    }catch(e){ /* audio unavailable — visual flash still works */ }
  }
  function flash(i, dur, cb){
    pads[i].classList.add("lit");
    beep(i, dur / 1000);
    setTimeout(function(){ pads[i].classList.remove("lit"); if (cb) cb(); }, dur);
  }
  function setPadsEnabled(on){
    pads.forEach(function(p){ p.disabled = !on; });
  }
  function playSequence(done){
    accepting = false; setPadsEnabled(false);
    var myRun = runId, i = 0;
    (function next(){
      if (myRun !== runId) return; // superseded by a restart
      if (i >= seq.length){ if (done) done(); return; }
      flash(seq[i], 420, function(){ if (myRun !== runId) return; i++; setTimeout(next, 180); });
    })();
  }
  function nextRound(){
    var myRun = runId;
    seq.push(Math.floor(Math.random() * 4));
    scoreEl.textContent = seq.length - 1;
    msgEl.innerHTML = "Watch&hellip;";
    setTimeout(function(){
      if (myRun !== runId) return; // superseded by a restart
      playSequence(function(){
        input = 0; accepting = true; setPadsEnabled(true);
        msgEl.textContent = "Your turn — repeat " + seq.length + ".";
      });
    }, 550);
  }
  function gameOver(){
    playing = false; accepting = false; setPadsEnabled(false);
    var reached = seq.length - 1;
    if (reached > best){ best = reached; bestEl.textContent = best; }
    scoreEl.textContent = reached;
    msgEl.innerHTML = "\u274C Wrong pad! You reached a sequence of <b>" + reached + "</b>. Press Start to try again.";
    startBtn.textContent = "Try Again";
    startBtn.disabled = false;
    // error buzz: flash all pads briefly
    pads.forEach(function(p){ p.classList.add("lit"); });
    setTimeout(function(){ pads.forEach(function(p){ p.classList.remove("lit"); }); }, 350);
  }
  function start(){
    runId++;
    seq = []; input = 0;
    scoreEl.textContent = 0;
    playing = true;
    startBtn.disabled = true;
    msgEl.textContent = "Get ready…";
    nextRound();
  }
  pads.forEach(function(p){
    p.addEventListener("click", function(){
      if (!accepting) return;
      var i = parseInt(p.dataset.i, 10);
      flash(i, 220);
      if (i !== seq[input]){ gameOver(); return; }
      input++;
      if (input === seq.length){
        accepting = false; setPadsEnabled(false);
        scoreEl.textContent = seq.length;
        if (seq.length > best){ best = seq.length; bestEl.textContent = best; }
        msgEl.innerHTML = "\u2705 Round <b>" + seq.length + "</b> cleared!";
        var myRun = runId;
        setTimeout(function(){ if (myRun === runId) nextRound(); }, 900);
      }
    });
  });
  startBtn.addEventListener("click", start);
  restartBtn.addEventListener("click", function(){
    startBtn.textContent = "Start";
    start();
  });
  setPadsEnabled(false);
})();
</script>
</body>
</html>
