<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rock Paper Scissors</title>
<style>
body { font-family: system-ui, sans-serif; background:#111; color:#eee; display:flex; flex-direction:column; align-items:center; min-height:100vh; margin:0; padding:20px; }
h1 { margin:10px 0; }
.choices { display:flex; gap:20px; margin:30px 0; }
button { font-size:3rem; padding:20px; background:#222; border:2px solid #444; border-radius:12px; cursor:pointer; transition:transform .1s; }
button:hover { transform:scale(1.1); background:#333; }
#result { font-size:1.5rem; margin:20px 0; min-height:2em; }
#score { font-size:1.2rem; }
</style>
</head>
<body>
<h1>Rock Paper Scissors</h1>
<div class="choices">
  <button data-choice="rock">✊</button>
  <button data-choice="paper">✋</button>
  <button data-choice="scissors">✌️</button>
</div>
<div id="result">Choose your move</div>
<div id="score">You: 0 | Computer: 0</div>
<script>
let playerScore = 0, compScore = 0;
const resultEl = document.getElementById("result");
const scoreEl = document.getElementById("score");
const choices = ["rock", "paper", "scissors"];
document.querySelectorAll("button").forEach(btn => {
  btn.onclick = () => play(btn.dataset.choice);
});
function play(player) {
  const comp = choices[Math.floor(Math.random()*3)];
  let msg = `You: ${emoji(player)} vs Computer: ${emoji(comp)} — `;
  if (player === comp) msg += "Tie!";
  else if ((player==="rock" && comp==="scissors") || (player==="paper" && comp==="rock") || (player==="scissors" && comp==="paper")) {
    msg += "You win!";
    playerScore++;
  } else {
    msg += "Computer wins!";
    compScore++;
  }
  resultEl.textContent = msg;
  scoreEl.textContent = `You: ${playerScore} | Computer: ${compScore}`;
}
function emoji(c) { return c==="rock"?"✊":c==="paper"?"✋":"✌️"; }
</script>
</body>
</html>
