<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper · Afterschool</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d100e;color:#e8f0e9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  .topbar{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#151a16;border:1px solid #232b24;border-radius:14px;padding:10px 14px}
  .topbar a{color:#7dffa3;text-decoration:none;font-size:.9rem;white-space:nowrap}
  .topbar h1{font-size:1.15rem;font-weight:700}
  button{cursor:pointer;font:inherit}
  .btn{background:#7dffa3;color:#0d100e;border:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:.88rem}
  .btn:hover{background:#a5ffc0}
  .status{width:100%;max-width:480px;margin-top:14px;background:#151a16;border:1px solid #232b24;border-radius:14px;padding:10px 14px;font-size:.95rem;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .status b{color:#7dffa3}
  .msg{width:100%;max-width:480px;min-height:1.4em;margin-top:10px;text-align:center;font-weight:600;color:#ffd97d}
  .hint{color:#93a396;font-size:.82rem;margin-top:10px;text-align:center;max-width:480px;line-height:1.5}
  .board{margin-top:14px;background:#151a16;border:1px solid #232b24;border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:min(94vw,420px);user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .cell{aspect-ratio:1;border:none;border-radius:7px;background:#2c3a2e;color:#e8f0e9;font-weight:800;font-size:1rem;display:flex;align-items:center;justify-content:center;padding:0}
  .cell:hover:not(.open){background:#3a4c3c}
  .cell.open{background:#10150f;cursor:default}
  .cell.mine{background:#5a2323;color:#ffb3b3}
  .cell.flag{color:#ffd97d}
  .cell.wrong{background:#5a2323}
  .n1{color:#8fd3ff}.n2{color:#7dffa3}.n3{color:#ffb35c}.n4{color:#c792ff}
  .n5{color:#ff7d7d}.n6{color:#4dd0e1}.n7{color:#e8f0e9}.n8{color:#93a396}
  .face{font-size:1.05rem}
</style>
</head>
<body>
  <div class="topbar">
    <a href="../../index.html">&larr; Afterschool</a>
    <h1>Minesweeper</h1>
    <button class="btn" id="newBtn">New Game</button>
  </div>
  <div class="status">
    <span>Mines left <b id="counter">10</b></span>
    <span class="face" id="face">Ready when you are</span>
    <span>Time <b id="timer">0:00</b></span>
  </div>
  <div class="msg" id="msg"></div>
  <div class="board" id="board"></div>
  <p class="hint">Click a square to reveal it. Right-click (or press and hold) to plant a flag where you think a mine is hiding. Clear every safe square to win — your first click is always safe.</p>
<script>
(function(){
  var N=9,MINES=10,TOTAL=N*N;
  var board=document.getElementById('board'),
      counterEl=document.getElementById('counter'),
      timerEl=document.getElementById('timer'),
      faceEl=document.getElementById('face'),
      msgEl=document.getElementById('msg');
  var mines,open,flags,started,over,wonGame,startStamp,timerInt,cells=[];

  for(var i=0;i<TOTAL;i++){
    var b=document.createElement('button');
    b.className='cell';b.type='button';b.dataset.i=i;
    board.appendChild(b);cells.push(b);
  }
  function neighbors(i){
    var r=Math.floor(i/N),c=i%N,out=[];
    for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;
      var nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<N&&nc>=0&&nc<N)out.push(nr*N+nc);
    }
    return out;
  }
  function count(i){return neighbors(i).reduce(function(s,j){return s+(mines.has(j)?1:0);},0);}
  function fmtTime(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
  function startTimer(){
    startStamp=Date.now();
    timerInt=setInterval(function(){
      timerEl.textContent=fmtTime(Math.floor((Date.now()-startStamp)/1000));
    },250);
  }
  function stopTimer(){if(timerInt)clearInterval(timerInt);timerInt=null;}
  function placeMines(safe){
    mines=new Set();
    var banned=new Set([safe].concat(neighbors(safe)));
    while(mines.size<MINES){
      var i=Math.floor(Math.random()*TOTAL);
      if(!banned.has(i))mines.add(i);
    }
  }
  function render(){
    counterEl.textContent=MINES-flags.size;
    for(var i=0;i<TOTAL;i++){
      var c=cells[i];c.className='cell';c.textContent='';
      if(open.has(i)){
        c.classList.add('open');
        if(mines.has(i)){c.classList.add('mine');c.textContent='✸';}
        else{var n=count(i);if(n>0){c.textContent=n;c.classList.add('n'+n);}}
      }else if(flags.has(i)){
        c.classList.add('flag');c.textContent='⚑';
        if(over&&!wonGame&&!mines.has(i))c.classList.add('wrong');
      }else if(over&&mines.has(i)){
        c.classList.add('mine');c.textContent='✸';
      }
    }
  }
  function reveal(i){
    if(over||flags.has(i)||open.has(i))return;
    if(!started){placeMines(i);started=true;startTimer();faceEl.textContent='Digging…';}
    if(mines.has(i)){open.add(i);lose();return;}
    var stack=[i];
    while(stack.length){
      var cur=stack.pop();
      if(open.has(cur)||flags.has(cur)||mines.has(cur))continue;
      open.add(cur);
      if(count(cur)===0)neighbors(cur).forEach(function(j){if(!open.has(j))stack.push(j);});
    }
    if(open.size===TOTAL-MINES)win();
    render();
  }
  function toggleFlag(i){
    if(over||open.has(i))return;
    if(flags.has(i))flags.delete(i);else flags.add(i);
    render();
  }
  function win(){
    over=true;wonGame=true;stopTimer();
    faceEl.textContent='You win!';
    var secs=startStamp?Math.floor((Date.now()-startStamp)/1000):0;
    msgEl.textContent='Board cleared in '+fmtTime(secs)+' — nice sweeping!';
  }
  function lose(){
    over=true;stopTimer();
    faceEl.textContent='Boom!';
    msgEl.textContent='That was a mine. Hit New Game to try again.';
    render();
  }
  function init(){
    mines=new Set();open=new Set();flags=new Set();
    started=false;over=false;wonGame=false;startStamp=0;
    stopTimer();timerEl.textContent='0:00';
    faceEl.textContent='Ready when you are';msgEl.textContent='';
    render();
  }
  document.getElementById('newBtn').addEventListener('click',init);

  var pressTimer=null,longPressed=false;
  board.addEventListener('contextmenu',function(e){
    e.preventDefault();
    var t=e.target.closest('.cell');if(t)toggleFlag(+t.dataset.i);
  });
  board.addEventListener('pointerdown',function(e){
    var t=e.target.closest('.cell');if(!t)return;
    longPressed=false;
    pressTimer=setTimeout(function(){longPressed=true;toggleFlag(+t.dataset.i);},450);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
    board.addEventListener(ev,function(){if(pressTimer)clearTimeout(pressTimer);});
  });
  board.addEventListener('click',function(e){
    var t=e.target.closest('.cell');if(!t)return;
    if(longPressed){longPressed=false;return;}
    if(e.button===0)reveal(+t.dataset.i);
  });
  init();
})();
</script>
</body>
</html>
