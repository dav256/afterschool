<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match — Afterschool</title>
<style>
  :root{--bg:#0d100e;--panel:#151a16;--accent:#7dffa3;--ink:#e8f0e9;--muted:#93a396;--line:#243028}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;min-height:100vh;padding:1.2rem 1rem 2.5rem}
  .wrap{max-width:560px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.8rem 1.1rem}
  .topbar a.back{color:var(--muted);text-decoration:none;font-size:.92rem;white-space:nowrap}
  .topbar a.back:hover{color:var(--accent)}
  .topbar h1{font-size:1.15rem;font-weight:600;text-align:center}
  button{background:var(--accent);color:#0d100e;border:none;border-radius:999px;padding:.55rem 1.15rem;font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap}
  button:hover{filter:brightness(1.08)}
  .status{display:flex;justify-content:space-between;gap:1rem;margin:1.1rem .2rem .4rem;font-size:.98rem}
  .status b{color:var(--accent);font-weight:600}
  .hint{color:var(--muted);font-size:.85rem;margin:0 .2rem 1.1rem}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:.65rem}
  .card{aspect-ratio:1;border:none;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:clamp(1.7rem,8vw,2.4rem);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s ease,background .15s ease;user-select:none;-webkit-user-select:none}
  .card:not(.up):hover{border-color:var(--accent)}
  .card .face{opacity:0;transform:scale(.6);transition:opacity .15s ease,transform .15s ease}
  .card.up{background:#1d2b20;border-color:var(--accent)}
  .card.up .face{opacity:1;transform:scale(1)}
  .card.done{background:#1d2b20;border-color:var(--line);cursor:default}
  .card.done .face{opacity:1;transform:scale(1)}
  .win{display:none;background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:1.1rem;text-align:center;margin-top:1.2rem;font-size:1.05rem}
  .win.show{display:block}
  .win b{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="../../index.html">&larr; Afterschool</a>
    <h1>Memory Match</h1>
    <button id="newBtn" type="button">New Game</button>
  </div>
  <div class="status">
    <span>Moves: <b id="moves">0</b></span>
    <span>Pairs: <b id="pairs">0 / 8</b></span>
    <span>Time: <b id="time">0:00</b></span>
  </div>
  <p class="hint">Flip two cards at a time and find all 8 matching pairs. Fewer moves and a faster time is better.</p>
  <div class="board" id="board"></div>
  <div class="win" id="win"></div>
</div>
<script>
(function(){
  "use strict";
  var EMOJIS = ["\uD83C\uDF55","\uD83D\uDE80","\uD83D\uDC22","\uD83C\uDFA7","\uD83C\uDF35","\uD83C\uDF69","\uD83D\uDEF8","\uD83C\uDF88"];
  var board = document.getElementById("board");
  var movesEl = document.getElementById("moves");
  var pairsEl = document.getElementById("pairs");
  var timeEl  = document.getElementById("time");
  var winEl   = document.getElementById("win");
  var first = null;        // first flipped card element
  var lock = false;        // board locked while checking a pair
  var moves = 0, found = 0;
  var seconds = 0, timerId = null, started = false;

  function fmt(s){ return Math.floor(s/60) + ":" + ("0" + (s%60)).slice(-2); }
  function startTimer(){
    if (started) return; started = true;
    timerId = setInterval(function(){ seconds++; timeEl.textContent = fmt(seconds); }, 1000);
  }
  function stopTimer(){ if (timerId){ clearInterval(timerId); timerId = null; } }
  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function update(){
    movesEl.textContent = moves;
    pairsEl.textContent = found + " / 8";
  }
  function newGame(){
    stopTimer(); seconds = 0; started = false;
    timeEl.textContent = "0:00";
    moves = 0; found = 0; first = null; lock = false;
    winEl.className = "win"; winEl.textContent = "";
    board.innerHTML = "";
    var deck = shuffle(EMOJIS.concat(EMOJIS).slice());
    deck.forEach(function(emo){
      var c = document.createElement("button");
      c.type = "button";
      c.className = "card";
      c.setAttribute("aria-label", "Face-down card");
      c.dataset.emoji = emo;
      var face = document.createElement("span");
      face.className = "face";
      face.textContent = emo;
      c.appendChild(face);
      c.addEventListener("click", function(){ flip(c); });
      board.appendChild(c);
    });
    update();
  }
  function flip(card){
    if (lock || card.classList.contains("up") || card.classList.contains("done")) return;
    startTimer();
    card.classList.add("up");
    if (!first){ first = card; return; }
    moves++;
    var a = first, b = card;
    first = null;
    if (a.dataset.emoji === b.dataset.emoji){
      a.classList.add("done"); b.classList.add("done");
      a.classList.remove("up"); b.classList.remove("up");
      found++;
      update();
      if (found === 8){
        stopTimer();
        winEl.innerHTML = "\uD83C\uDF89 You found all 8 pairs in <b>" + moves + " moves</b> and <b>" + fmt(seconds) + "</b>!";
        winEl.classList.add("show");
      }
    } else {
      lock = true;
      update();
      setTimeout(function(){
        a.classList.remove("up"); b.classList.remove("up");
        lock = false;
      }, 750);
    }
  }
  document.getElementById("newBtn").addEventListener("click", newGame);
  newGame();
})();
</script>
</body>
</html>
