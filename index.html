<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>Afterschool</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-shell">
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- App header -->
  <header class="app-header" id="app-header">
    <a href="./" class="app-brand">
      <img src="logo-white.svg" alt="" class="brand-mark" onerror="this.style.display='none'" />
      <span class="brand-name">afterschool</span>
    </a>
    <div class="header-right">
      <div class="coins-pill" id="coins-pill">🪙 <span id="coins-count">0</span></div>
      <div id="float-clock" class="header-clock">--:--</div>
    </div>
  </header>

  <div id="game-day-banner" hidden></div>

  <div class="app">
    <aside class="sidebar desktop-only" id="sidebar">
      <nav class="nav">
        <div class="nav-group">
          <div class="nav-label">Explore</div>
          <button class="nav-item active" data-filter="all">All games <span class="count" id="total-count">0</span></button>
          <button class="nav-item" data-filter="popular">Popular</button>
          <button class="nav-item" data-filter="Board" id="btn-playables">Playables</button>
          <button class="nav-item" id="btn-surprise">🎲 Surprise me</button>
        </div>
        <div class="nav-group">
          <div class="nav-label">You</div>
          <div id="streak-badge" class="streak-badge" hidden>🔥 0 day streak</div>
        </div>
        <div class="nav-group">
          <div class="nav-label">Leaderboard</div>
          <div id="leaderboard" class="leaderboard"></div>
        </div>
        <div class="nav-group">
          <div class="nav-label">Tools</div>
          <button class="nav-item" id="btn-music">♫ Music</button>
          <button class="nav-item" id="btn-settings">Settings</button>
          <button class="nav-item" id="btn-admin">Admin</button>
        </div>
      </nav>
    </aside>

    <main class="main">
      <div class="panel">
        <div id="potd" class="potd" hidden></div>
        <div class="searchbar">
          <input type="search" id="search" placeholder="Search games..." autocomplete="off" />
        </div>
        <div class="chips" id="chips"></div>
        <div class="grid" id="grid"></div>
      </div>
    </main>
  </div>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Main">
    <button class="bn-item active" data-bn="games" type="button">
      <span class="bn-icon">🎮</span><span class="bn-label">Games</span>
    </button>
    <button class="bn-item" data-bn="playables" type="button">
      <span class="bn-icon">♟</span><span class="bn-label">Playables</span>
    </button>
    <button class="bn-item" data-bn="music" type="button" id="bn-music">
      <span class="bn-icon">🎵</span><span class="bn-label">Music</span>
    </button>
    <button class="bn-item" data-bn="settings" type="button" id="bn-settings">
      <span class="bn-icon">⚙️</span><span class="bn-label">More</span>
    </button>
  </nav>

  <div class="modal" id="settings-modal" hidden>
    <div class="modal-card" style="max-width:480px">
      <div class="modal-head">
        <h3>Settings</h3>
        <button class="modal-close" id="settings-close" type="button">×</button>
      </div>
      <div class="admin-tabs" style="margin-bottom:16px">
        <button class="admin-tab active" data-settings-tab="style" type="button">Look</button>
        <button class="admin-tab" data-settings-tab="gameday" type="button">Game Day</button>
        <button class="admin-tab" data-settings-tab="cloak" type="button">Cloak</button>
      </div>
      <div id="settings-tab-style" class="admin-tab-content">
        <div class="settings-section">
          <label>Theme</label>
          <div class="theme-row">
            <button class="pill-btn" data-theme="default" type="button">Default</button>
            <button class="pill-btn" data-theme="cyber" type="button">Cyber</button>
            <button class="pill-btn" data-theme="retro" type="button">Retro</button>
            <button class="pill-btn" data-theme="ocean" type="button">Ocean</button>
            <button class="pill-btn" data-theme="spirit" type="button">School Spirit</button>
            <button class="pill-btn" data-theme="midnight" type="button">Midnight</button>
          </div>
        </div>
        <div class="settings-section">
          <label>Accent</label>
          <div class="color-swatches" id="accent-swatches">
            <button class="swatch" data-accent="#9fe8d0" style="background:#9fe8d0" type="button"></button>
            <button class="swatch" data-accent="#00ff9f" style="background:#00ff9f" type="button"></button>
            <button class="swatch" data-accent="#ff6b35" style="background:#ff6b35" type="button"></button>
            <button class="swatch" data-accent="#4ecdc4" style="background:#4ecdc4" type="button"></button>
            <button class="swatch" data-accent="#f5c542" style="background:#f5c542" type="button"></button>
            <button class="swatch" data-accent="#a78bfa" style="background:#a78bfa" type="button"></button>
            <button class="swatch" data-accent="#3b82f6" style="background:#3b82f6" type="button"></button>
            <button class="swatch" data-accent="#ec4899" style="background:#ec4899" type="button"></button>
          </div>
        </div>
        <div class="settings-section">
          <label>Background</label>
          <div class="theme-row" id="motion-row">
            <button class="pill-btn" data-motion="none" type="button">None</button>
            <button class="pill-btn" data-motion="snow" type="button">Snow</button>
            <button class="pill-btn" data-motion="rain" type="button">Rain</button>
            <button class="pill-btn active" data-motion="stars" type="button">Stars</button>
          </div>
        </div>
        <div class="toggle-row"><span>Show clock</span><input type="checkbox" id="opt-show-clock" checked /></div>
        <div class="toggle-row"><span>24-hour time</span><input type="checkbox" id="opt-24h" /></div>
        <div class="toggle-row"><span>Reduce motion</span><input type="checkbox" id="opt-reduce-motion" /></div>
        <div style="margin-top:12px">
          <button class="btn" id="btn-admin-mobile" type="button" style="width:100%">Admin panel</button>
        </div>
      </div>
      <div id="settings-tab-gameday" class="admin-tab-content" hidden>
        <div class="toggle-row"><span>Enable Game Day</span><input type="checkbox" id="game-day-toggle" /></div>
        <div class="settings-section" style="margin-top:12px">
          <label>Mode</label>
          <div class="row" style="gap:16px;margin-top:6px">
            <label style="display:flex;align-items:center;gap:6px;font-weight:500"><input type="radio" name="gd-mode" id="gd-mode-pro" checked /> Pro / College</label>
            <label style="display:flex;align-items:center;gap:6px;font-weight:500"><input type="radio" name="gd-mode" id="gd-mode-school" /> School</label>
          </div>
        </div>
        <div id="gd-pro-fields">
          <div class="settings-section"><label>League</label>
            <select class="settings-select" id="gd-league"><option value="nfl">NFL</option><option value="nba">NBA</option><option value="cfb">College Football</option></select>
          </div>
          <div class="settings-section"><label>Team</label>
            <select class="settings-select" id="gd-team"><option value="">Select league…</option></select>
          </div>
        </div>
        <div id="gd-school-fields" hidden>
          <div class="settings-section"><label>School / team</label>
            <input type="text" class="settings-input" id="gd-school-name" placeholder="Rose Park Titans" />
          </div>
        </div>
        <div class="settings-section"><label>Banner message</label>
          <input type="text" class="settings-input" id="game-day-message" placeholder="It's Game Day!" />
        </div>
        <div class="settings-section"><label>Logo URL</label>
          <input type="text" class="settings-input" id="game-day-logo" placeholder="https://..." />
        </div>
        <div class="settings-section"><label>Score</label>
          <input type="text" class="settings-input" id="game-day-score" placeholder="Live or manual" />
          <button type="button" class="btn" id="gd-fetch-score" style="margin-top:8px;width:100%">Fetch live score</button>
          <span id="gd-score-status" class="muted" style="font-size:0.8rem"></span>
        </div>
        <div class="toggle-row"><span>Auto-refresh score</span><input type="checkbox" id="game-day-auto-score" checked /></div>
        <div class="toggle-row"><span>Sports games only</span><input type="checkbox" id="game-day-sports" /></div>
      </div>
      <div id="settings-tab-cloak" class="admin-tab-content" hidden>
        <div class="settings-section"><label>Tab title disguise</label>
          <input type="text" class="settings-input" id="cloak-title" placeholder="Essay draft - Google Docs" />
        </div>
        <div class="toggle-row"><span>Auto-cloak on load</span><input type="checkbox" id="cloak-auto" /></div>
      </div>
    </div>
  </div>

  <div class="modal" id="admin-modal" hidden>
    <div class="modal-card" style="max-width:560px">
      <div class="modal-head"><h3>Admin</h3><button class="modal-close" id="admin-close" type="button">×</button></div>
      <div id="admin-login">
        <p class="muted" style="margin-bottom:12px">Password required.</p>
        <input type="password" id="admin-pass" class="settings-input" placeholder="Password" />
        <button class="btn" id="admin-login-btn" type="button" style="margin-top:12px;width:100%">Login</button>
        <p class="muted" style="margin-top:10px;font-size:0.8rem">Default: <code>afterschool</code></p>
      </div>
      <div id="admin-panel" hidden>
        <button class="btn" id="btn-add-game" type="button" style="margin-bottom:12px;width:100%">Add Game</button>
        <ul id="admin-game-list" class="admin-list"></ul>
      </div>
    </div>
  </div>

  <div class="modal" id="game-editor-modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><h3>Game Editor</h3>
        <button class="modal-close" type="button" onclick="document.getElementById('game-editor-modal').hidden=true">×</button>
      </div>
      <form id="game-editor-form">
        <div class="settings-section"><label>ID</label><input type="text" class="settings-input" id="editor-id" /></div>
        <div class="settings-section"><label>Name</label><input type="text" class="settings-input" id="editor-name" required /></div>
        <div class="settings-section"><label>Category</label><input type="text" class="settings-input" id="editor-category" value="Arcade" /></div>
        <div class="settings-section"><label>Path</label><input type="text" class="settings-input" id="editor-path" required /></div>
        <div class="settings-section"><label>Icon</label><input type="text" class="settings-input" id="editor-icon" value="🎮" /></div>
        <div class="settings-section"><label>Color</label><input type="color" id="editor-color" value="#6366f1" /></div>
        <div class="toggle-row"><span>Popular</span><input type="checkbox" id="editor-popular" /></div>
        <div class="toggle-row"><span>Disabled</span><input type="checkbox" id="editor-disabled" /></div>
        <div class="settings-section"><label>Note</label><input type="text" class="settings-input" id="editor-note" value="Local" /></div>
        <div class="row" style="margin-top:16px;gap:8px">
          <button type="button" class="btn" id="ge-save" style="flex:1">Save</button>
          <button type="button" class="btn btn-ghost" id="ge-cancel" style="flex:1">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
  <script src="js/look.js"></script>
  <script src="js/fern-ui.js"></script>
</body>
</html>
