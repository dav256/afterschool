<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Afterschool</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .settings-section { margin-bottom: 20px; }
    .settings-section label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    .settings-section .hint { font-size: 0.8rem; color: #888; margin-bottom: 8px; }
    .settings-input, .settings-select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; font-size: 0.95rem; }
    .settings-row { display: flex; gap: 10px; align-items: center; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222; }
    .toggle-row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div id="float-clock" style="position:fixed;top:12px;right:12px;z-index:50;background:rgba(16,16,16,0.85);backdrop-filter:blur(8px);padding:6px 12px;border-radius:999px;font-size:0.85rem;font-weight:600;border:1px solid #222;display:none">00:00</div>
  <div id="game-day-banner" hidden style="margin:12px 16px;padding:14px 18px;background:#1a3a6b22;border:1px solid #1a3a6b;border-radius:14px;font-weight:600;display:flex;align-items:center;gap:10px;"></div>
  <div class="app">
    <aside class="sidebar">
      <a href="./" class="logo"><img src="logo-white.svg" alt="Afterschool" class="logo-img" /></a>
      <nav class="nav">
        <div class="nav-group">
          <div class="nav-label">Explore</div>
          <button class="nav-item active" data-filter="all">All games <span class="count" id="total-count">0</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-label">Tools</div>
          <button class="nav-item" id="btn-settings">Settings</button>
          <button class="nav-item" id="btn-admin">Admin panel</button>
        </div>
      </nav>
    </aside>
    <main class="main">
      <div class="panel">
        <div class="grid" id="grid"></div>
      </div>
    </main>
  </div>

  <div class="modal" id="settings-modal" hidden>
    <div class="modal-card" style="max-width:480px;">
      <div class="modal-head">
        <h3>Settings</h3>
        <button class="modal-close" id="settings-close">×</button>
      </div>
      <div class="admin-tabs" style="margin-bottom:16px;">
        <button class="admin-tab active" data-settings-tab="cloak">Cloak</button>
        <button class="admin-tab" data-settings-tab="style">Site</button>
        <button class="admin-tab" data-settings-tab="gameday">Game Day</button>
      </div>

      <div id="settings-tab-cloak" class="admin-tab-content">
        <div class="settings-section">
          <label>Tab disguise</label>
          <p class="hint">Changes this tab's title and icon so it looks like schoolwork.</p>
          <input type="text" class="settings-input" id="cloak-title" placeholder="e.g. Essay draft - Google Docs" />
        </div>
        <div class="toggle-row">
          <span>Auto-cloak on load</span>
          <input type="checkbox" id="cloak-auto" />
        </div>
      </div>

      <div id="settings-tab-style" class="admin-tab-content" hidden>
        <div class="settings-section">
          <label>Accent color</label>
          <input type="color" id="style-accent" value="#f5f5f5" />
        </div>
        <div class="settings-section">
          <label>Site name</label>
          <input type="text" class="settings-input" id="style-name" value="afterschool" />
        </div>
      </div>

      <div id="settings-tab-gameday" class="admin-tab-content" hidden>
        <div class="toggle-row">
          <span>Enable Game Day mode</span>
          <input type="checkbox" id="game-day-toggle" />
        </div>
        <div class="settings-section" style="margin-top:16px;">
          <label>Team / School</label>
          <select class="settings-select" id="game-day-preset">
            <option value="rosepark">Rose Park Middle (Titans)</option>
            <option value="titans">Tennessee Titans</option>
            <option value="grizzlies">Memphis Grizzlies</option>
            <option value="volunteers">Tennessee Volunteers</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="settings-section">
          <label>Banner message</label>
          <input type="text" class="settings-input" id="game-day-message" placeholder="It's Game Day — Go Titans!" />
        </div>
        <div class="settings-section">
          <label>Logo URL</label>
          <p class="hint">Optional. Prefer openly licensed images.</p>
          <input type="text" class="settings-input" id="game-day-logo" placeholder="https://..." />
        </div>
        <div class="settings-section">
          <label>Score</label>
          <input type="text" class="settings-input" id="game-day-score" placeholder="e.g. 21-14" />
        </div>
        <div class="toggle-row">
          <span>Show sports games only</span>
          <input type="checkbox" id="game-day-sports" />
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="admin-modal" hidden>
    <div class="modal-card" style="max-width:560px">
      <div class="modal-head">
        <h3>Admin</h3>
        <button class="modal-close" id="admin-close">×</button>
      </div>
      <div id="admin-login">
        <p class="muted" style="margin-bottom:12px">Password required.</p>
        <input type="password" id="admin-pass" class="settings-input" placeholder="Password" />
        <button class="btn" id="admin-login-btn" style="margin-top:12px;width:100%">Login</button>
        <p class="muted" style="margin-top:10px;font-size:0.8rem">Default: <code>afterschool</code></p>
      </div>
      <div id="admin-panel" hidden>
        <div id="tab-games" class="admin-tab-content">
          <button class="btn" id="btn-add-game" style="margin-bottom:12px;width:100%">Add Game</button>
          <ul id="admin-game-list" class="admin-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="game-editor-modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h3>Game Editor</h3>
        <button class="modal-close" onclick="document.getElementById('game-editor-modal').hidden=true">×</button>
      </div>
      <form id="game-editor-form">
        <div class="settings-section">
          <label>ID</label>
          <input type="text" class="settings-input" id="editor-id" />
        </div>
        <div class="settings-section">
          <label>Name</label>
          <input type="text" class="settings-input" id="editor-name" required />
        </div>
        <div class="settings-section">
          <label>Category</label>
          <input type="text" class="settings-input" id="editor-category" value="Arcade" />
        </div>
        <div class="settings-section">
          <label>Path</label>
          <input type="text" class="settings-input" id="editor-path" required />
        </div>
        <div class="settings-section">
          <label>Icon</label>
          <input type="text" class="settings-input" id="editor-icon" value="🎮" />
        </div>
        <div class="settings-section">
          <label>Color</label>
          <input type="color" id="editor-color" value="#6366f1" />
        </div>
        <div class="toggle-row">
          <span>Popular</span>
          <input type="checkbox" id="editor-popular" />
        </div>
        <div class="toggle-row">
          <span>Disabled</span>
          <input type="checkbox" id="editor-disabled" />
        </div>
        <div class="settings-section">
          <label>Note</label>
          <input type="text" class="settings-input" id="editor-note" value="Local" />
        </div>
        <div class="row" style="margin-top:16px;gap:8px">
          <button type="button" class="btn" id="ge-save" style="flex:1">Save</button>
          <button type="button" class="btn btn-ghost" id="ge-cancel" style="flex:1">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("btn-settings")?.addEventListener("click", () => {
      document.getElementById("settings-modal").hidden = false;
    });
    document.getElementById("settings-close")?.addEventListener("click", () => {
      document.getElementById("settings-modal").hidden = true;
    });
    document.querySelectorAll("[data-settings-tab]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".admin-tab-content").forEach(c => c.hidden = true);
        document.querySelectorAll("[data-settings-tab]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("settings-tab-" + btn.dataset.settingsTab).hidden = false;
      });
    });
  </script>
</body>
</html>
